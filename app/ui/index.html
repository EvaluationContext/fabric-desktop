<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fabric Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="#0f6b5c"/><path d="M7 16 12 7l5 9" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Fabric Desktop</span>
    </div>
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"></nav>
    <div class="search-wrap">
      <label class="search">
        <span data-icon="search" data-size="16"></span>
        <span class="sr-only">Search</span>
        <input id="search" type="search" placeholder="Search notebooks, workspaces and lakehouses">
      </label>
    </div>
    <div class="topbar-right">
      <span class="pill"><span data-icon="desktop" data-size="14"></span>Local compute</span>
      <button id="account" class="avatar" title="Sign in">?</button>
    </div>
  </header>

  <div class="body">
    <nav id="rail" class="rail" aria-label="Main">
      <button class="rail-item" data-view="home"><span data-icon="home" data-size="22"></span>Home</button>
      <button class="rail-item" data-view="create"><span data-icon="create" data-size="22"></span>Create</button>
      <button class="rail-item" data-view="workspaces"><span data-icon="workspaces" data-size="22"></span>Workspaces</button>
      <button class="rail-item" data-view="onelake"><span data-icon="onelake" data-size="22"></span>OneLake</button>
      <button class="rail-item" data-view="monitor"><span data-icon="monitor" data-size="22"></span>Monitor</button>
      <div class="rail-divider"></div>
      <div id="rail-open"></div>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <div id="dialog-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
