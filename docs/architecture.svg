<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Segoe UI Variable Text', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Fabric Desktop architecture</title>
  <desc id="d">The desktop app and its Python engine run on your Windows PC. They sign in with Microsoft Entra ID, manage items through the Fabric REST API, read and write Delta tables in OneLake, embed Fabric portal pages, and update from GitHub Releases.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t1 { font-size: 26px; font-weight: 600; fill: #1f2328; }
      .t2 { font-size: 15px; fill: #57606a; }
      .zone { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .hs { font-size: 13.5px; font-weight: 600; fill: #1f2328; }
      .p { font-size: 12.5px; fill: #57606a; }
      .m { font-size: 12px; fill: #57606a; font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
      .lbl { font-size: 12px; fill: #424a53; }
      .chip { font-size: 12px; fill: #1f2328; }
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .wire { fill: none; stroke: #57606a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#ffffff"/>
  <text x="40" y="52" class="t1">Fabric Desktop architecture</text>
  <text x="40" y="78" class="t2">Compute runs on your PC. Fabric provides sign-in, item management and OneLake storage, so no Fabric capacity is used.</text>

  <!-- Zones -->
  <rect x="40" y="100" width="960" height="830" rx="14" fill="#f2f8f6" stroke="#b7d8cf"/>
  <text x="64" y="128" class="zone" fill="#0a4f44">YOUR WINDOWS PC</text>
  <rect x="1160" y="100" width="400" height="830" rx="14" fill="#f2f6fc" stroke="#bcd0ea"/>
  <text x="1184" y="128" class="zone" fill="#0f548c">MICROSOFT CLOUD AND GITHUB</text>

  <!-- App shell -->
  <rect x="70" y="145" width="900" height="290" rx="10" fill="#ffffff" stroke="#0f6b5c" stroke-width="1.4"/>
  <rect x="70" y="145" width="900" height="36" rx="10" fill="#0f6b5c"/>
  <rect x="70" y="165" width="900" height="16" fill="#0f6b5c"/>
  <text x="90" y="169" font-size="15" font-weight="600" fill="#ffffff">Fabric Desktop app</text>
  <text x="950" y="169" font-size="12.5" fill="#d7ece7" text-anchor="end">Tauri 2 shell (Rust), fabric-desktop.exe</text>

  <rect x="95" y="200" width="425" height="215" rx="8" class="box"/>
  <text x="115" y="228" class="h">App UI</text>
  <text x="115" y="248" class="p">WebView2 · Fabric-style pages in plain HTML and JavaScript</text>
  <g>
    <rect x="115" y="266" width="185" height="30" rx="6" fill="#e6f2ef"/><text x="130" y="286" class="chip">Notebooks</text>
    <rect x="315" y="266" width="185" height="30" rx="6" fill="#e6f2ef"/><text x="330" y="286" class="chip">SQL query</text>
    <rect x="115" y="306" width="185" height="30" rx="6" fill="#e6f2ef"/><text x="130" y="326" class="chip">OneLake catalog</text>
    <rect x="315" y="306" width="185" height="30" rx="6" fill="#e6f2ef"/><text x="330" y="326" class="chip">Metadata framework</text>
    <rect x="115" y="346" width="185" height="30" rx="6" fill="#e6f2ef"/><text x="130" y="366" class="chip">Workspaces, lakehouses</text>
    <rect x="315" y="346" width="185" height="30" rx="6" fill="#e6f2ef"/><text x="330" y="366" class="chip">Monitor (local runs)</text>
  </g>
  <text x="115" y="400" class="p">Each action is one command to the shell</text>

  <rect x="545" y="200" width="400" height="100" rx="8" class="box"/>
  <text x="565" y="228" class="h">Fabric view</text>
  <text x="565" y="250" class="p">A second WebView2 inside the window that shows</text>
  <text x="565" y="268" class="p">Fabric's Monitoring hub and OneLake catalog.</text>
  <text x="565" y="286" class="p">Its sign-in is saved, encrypted with Windows DPAPI.</text>

  <rect x="545" y="315" width="400" height="100" rx="8" class="box"/>
  <text x="565" y="343" class="h">Startup check</text>
  <text x="565" y="365" class="p">On launch: installs a newer exe if one is released,</text>
  <text x="565" y="383" class="p">checks Python 3.11+, and installs the sidecar built</text>
  <text x="565" y="401" class="p">from the same commit, so the two always match.</text>

  <!-- Shell to sidecar -->
  <path d="M300 437 V496" class="wire" marker-end="url(#a)"/>
  <text x="312" y="464" class="lbl">Commands and results</text>
  <text x="312" y="480" class="m">JSON lines over stdio</text>

  <!-- Sidecar -->
  <rect x="70" y="500" width="900" height="275" rx="10" fill="#ffffff" stroke="#0f6b5c" stroke-width="1.4"/>
  <rect x="70" y="500" width="900" height="36" rx="10" fill="#0f6b5c"/>
  <rect x="70" y="520" width="900" height="16" fill="#0f6b5c"/>
  <text x="90" y="524" font-size="15" font-weight="600" fill="#ffffff">Local engine</text>
  <text x="950" y="524" font-size="12.5" fill="#d7ece7" text-anchor="end">Python sidecar, package fabric_desktop</text>

  <rect x="95" y="555" width="158" height="92" rx="8" class="box"/>
  <text x="110" y="580" class="hs">Notebook kernel</text>
  <text x="110" y="602" class="p">Python cells, Polars,</text>
  <text x="110" y="620" class="p">lakehouse API</text>

  <rect x="268" y="555" width="158" height="92" rx="8" class="box"/>
  <text x="283" y="580" class="hs">SQL engine</text>
  <text x="283" y="602" class="p">Spark SQL, run in</text>
  <text x="283" y="620" class="p">DuckDB via sqlglot</text>

  <rect x="441" y="555" width="158" height="92" rx="8" class="box"/>
  <text x="456" y="580" class="hs">Metadata framework</text>
  <text x="456" y="602" class="p">Layers, entities, gates,</text>
  <text x="456" y="620" class="p">SCD and incremental</text>

  <rect x="614" y="555" width="158" height="92" rx="8" class="box"/>
  <text x="629" y="580" class="hs">Job runner</text>
  <text x="629" y="602" class="p">DuckDB and Polars</text>
  <text x="629" y="620" class="p">job files</text>

  <rect x="787" y="555" width="158" height="92" rx="8" class="box"/>
  <text x="802" y="580" class="hs">Auth</text>
  <text x="802" y="602" class="p">MSAL, delegated</text>
  <text x="802" y="620" class="p">sign-in, token cache</text>

  <rect x="95" y="662" width="504" height="92" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="110" y="687" class="hs">OneLake I/O</text>
  <text x="110" y="709" class="p">delta-rs reads only the columns and files a query needs. Writes put the</text>
  <text x="110" y="727" class="p">data files first and commit the Delta log last, after a check against</text>
  <text x="110" y="745" class="p">the Fabric-safe Delta profile (reader 1, writer 2, no deletion vectors).</text>

  <rect x="614" y="662" width="331" height="92" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="629" y="687" class="hs">Fabric REST client</text>
  <text x="629" y="709" class="p">Workspaces, items, lakehouses,</text>
  <text x="629" y="727" class="p">notebook publish and the</text>
  <text x="629" y="745" class="p">endorsement (admin) scan</text>

  <!-- Local storage -->
  <path d="M520 777 V808" class="wire" marker-end="url(#a)"/>
  <rect x="70" y="812" width="900" height="98" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="838" class="hs">On this PC</text>
  <text x="182" y="838" class="m">%LOCALAPPDATA%\FabricDesktop</text>
  <text x="408" y="838" class="p">and your metadata project folder</text>
  <g>
    <rect x="90" y="852" width="132" height="30" rx="6" fill="#eef1f4"/><text x="104" y="872" class="chip">Notebooks .ipynb</text>
    <rect x="232" y="852" width="100" height="30" rx="6" fill="#eef1f4"/><text x="246" y="872" class="chip">Token cache</text>
    <rect x="342" y="852" width="96" height="30" rx="6" fill="#eef1f4"/><text x="356" y="872" class="chip">Run history</text>
    <rect x="448" y="852" width="118" height="30" rx="6" fill="#eef1f4"/><text x="462" y="872" class="chip">Staging copies</text>
    <rect x="576" y="852" width="138" height="30" rx="6" fill="#eef1f4"/><text x="590" y="872" class="chip">Saved Fabric sign-in</text>
    <rect x="724" y="852" width="226" height="30" rx="6" fill="#e6f2ef"/><text x="738" y="872" class="chip">Metadata project (your Git folder)</text>
  </g>

  <!-- Cloud services -->
  <rect x="1185" y="150" width="350" height="100" rx="8" class="box"/>
  <text x="1205" y="178" class="h">Fabric portal</text>
  <text x="1205" y="199" class="m">app.fabric.microsoft.com</text>
  <text x="1205" y="222" class="p">Monitoring hub and OneLake catalog,</text>
  <text x="1205" y="239" class="p">shown live in the Fabric view</text>

  <rect x="1185" y="285" width="350" height="85" rx="8" class="box"/>
  <text x="1205" y="313" class="h">GitHub Releases</text>
  <text x="1205" y="334" class="m">fabric-desktop.exe, version.json</text>
  <text x="1205" y="356" class="p">Replaced by every green build of main</text>

  <rect x="1185" y="405" width="350" height="78" rx="8" class="box"/>
  <text x="1205" y="433" class="h">Microsoft Entra ID</text>
  <text x="1205" y="455" class="p">Signs you in with your own account</text>
  <text x="1205" y="472" class="p">(delegated, no service principal)</text>

  <rect x="1185" y="515" width="350" height="100" rx="8" class="box"/>
  <text x="1205" y="543" class="h">Fabric REST API</text>
  <text x="1205" y="564" class="m">api.fabric.microsoft.com</text>
  <text x="1205" y="587" class="p">Workspaces, lakehouses and notebooks;</text>
  <text x="1205" y="604" class="p">Power BI admin scanner for endorsement</text>

  <rect x="1185" y="645" width="350" height="190" rx="8" class="box"/>
  <text x="1205" y="673" class="h">OneLake</text>
  <text x="1205" y="694" class="m">onelake.dfs.fabric.microsoft.com</text>
  <rect x="1205" y="710" width="310" height="80" rx="6" fill="#f2f6fc" stroke="#bcd0ea"/>
  <text x="1220" y="734" class="hs">Lakehouse</text>
  <text x="1220" y="756" class="m">Tables/</text><text x="1290" y="756" class="p">Delta tables, by schema</text>
  <text x="1220" y="776" class="m">Files/</text><text x="1290" y="776" class="p">raw files</text>
  <text x="1205" y="814" class="p">OneLake table API lists schemas and tables</text>

  <!-- Wires: app to cloud -->
  <path d="M945 225 H1181" class="wire" marker-end="url(#a)"/>
  <text x="1012" y="200" class="lbl">Your Fabric session</text>
  <text x="1012" y="216" class="lbl">(HTTPS)</text>
  <path d="M945 335 H1181" class="wire" marker-end="url(#a)"/>
  <text x="1012" y="310" class="lbl">Release check</text>
  <text x="1012" y="326" class="lbl">on launch</text>

  <!-- Wires: sidecar to cloud -->
  <path d="M970 548 H1090 V444 H1181" class="wire" marker-end="url(#a)"/>
  <text x="1012" y="540" class="lbl">Tokens</text>
  <path d="M970 600 H1181" class="wire" marker-end="url(#a)"/>
  <text x="1012" y="591" class="lbl">Item management</text>
  <path d="M970 735 H1181" class="wire" marker-end="url(#a)"/>
  <text x="1012" y="726" class="lbl">Delta reads and writes</text>

  <!-- Footer -->
  <text x="40" y="975" class="p">Each arrow points from the side that starts the call; results come back the same way. Notebooks, SQL queries, jobs and metadata runs all execute on this PC.</text>
</svg>
