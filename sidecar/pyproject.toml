[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-desktop"
version = "0.2.0"
description = "Run data jobs on your own machine and publish Delta tables to Microsoft Fabric OneLake."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=16",
    "deltalake>=0.25",
    "msal>=1.28",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fabric-desktop = "fabric_desktop.cli:main"

[tool.setuptools]
packages = ["fabric_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
